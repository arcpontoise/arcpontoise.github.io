# Foire aux questions (page /foire-aux-questions/). Réponses en Markdown.

- question: Que comprend la cotisation ?
  reponse: |
    - La part fédérale (Fédération Française de Tir à l'Arc)
      - La licence
      - L'assurance
    - La part compagnie
      - Accès aux pas de tir aussi souvent que vous le souhaitez (dans la limite des horaires d'ouverture !)
      - Cours / Entraînements compétition
      - Prêt d'un arc si nécessaire

    Pour les débutants s'ajoutent :
    - Formation
    - Matériel personnel (flèches, carquois, palette, protège-bras)
    - Prêt d'un arc pendant les deux premiers trimestres de formation (possibilité de location d'un arc après la période de prêt)
- question: Combien coûtent les cours ?
  reponse: |
    La formation initiale est incluse dans votre cotisation annuelle.
    Les compétiteurs profitent également d'un coaching et d’entraînements spécifiques.
- question: Pourquoi une compagnie plutôt qu'un club ?
  reponse: |
    Une *Compagnie* signifie une adhésion aux valeurs de la Chevalerie comme la solidarité, le respect, la courtoisie et l’honneur, le respect des traditions, au contraire des clubs de tir à l’arc, à vocation purement sportive.
    Dans les Compagnies les plus traditionnelles, on respecte l’organisation suivante :

    - Le Capitaine (président) dirige la Compagnie.
    - Le Premier Lieutenant (secrétaire), l’assiste dans ses fonctions, et assure la relation avec les archers de la Compagnie.
    - Le Sous-lieutenant trésorier (trésorier) s’occupe des finances de la compagnie. Il peut être assisté d’un adjoint.
    - Le(s) Censeur est responsable du respect des traditions, de l’ordre et de la discipline.

    Les traditions suivantes sont encore en vigueur dans notre Compagnie de Pontoise.
- question: Quelles sont les traditions dans une compagnie d'archers ?
  reponse: |
    #### Le salut

    La première tradition consiste à saluer les archers présents avant de tirer sa première flèche. L’archer doit saluer de vive voix en disant « Archers, je vous salue ». Les archers présents répondent par « Salut ». Un archer seul se doit de néanmoins saluer. Un archer ne saluant pas à sa première flèche peut se faire reprendre par le Censeur et se faire mettre à l’amende.

    #### Le Tir de la Saint Sébastien

    Saint Sébastien est le saint patron des archers.
    Tous les ans, le dimanche le plus proche du 20 janvier, jour de la Saint Sébastien, est organisé un concours où tous les archers se doivent d’être présents. Il est de bon ton d’être vêtu de la tenue de la compagnie.
    Le tir se déroule sur une flèche et sur une Beursault. Chacun à son tour, le bureau d’abord puis par ordre d’ancienneté,  salue et tire une flèche. Lorsque tout le monde a tiré, la Compagnie va vers la cible et on retire les flèches unes à une en notant le nom de l’archer ayant effectué le meilleur tir, à côté de l’impact. Deux autres volées sont tirées de manière similaire et l’archer ayant tiré le plus près du centre est déclaré vainqueur. On lui remet solennellement le blason toujours percé de sa flèche, une flèche de bois à plumes blanches gravée à la date de l’événement et une médaille de Saint Sébastien. La journée se termine en général par un banquet.

    #### L’Abat Oiseau ou Tir du Roi

    Second tir traditionnel, l’abat oiseau est un moment important de la vie d’une Compagnie d’Arc.
    Le « Roy » de l’année précédente a préparé une carte (un blason Beursault décoré) au centre de laquelle il
    a installé « l’oiseau », en plâtre ou en bois, d’une taille d’environ 2,5 x 5 cm, décoré de plumes. Le « roi » remet son titre en jeu : celui qui réussira à toucher l’oiseau le premier sera déclaré Roy de l’année. Le concours se déroule de la manière suivante : La distance de tir est de 50m. Les archers tirent une flèche par tour, dans l’ordre, avec pour commencer, le roi de l’année précédente, suivi des membres du bureau, puis des archers par ordre d’ancienneté. Le salut avant la première flèche est obligatoire : un oubli est aussitôt sanctionné par le prévôt qui met le contrevenant à l’amende.
    Si l’oiseau n’a pas été touché, le tir recommence dans le même ordre jusqu’à ce qu’il soit atteint. Parallèlement, a lieu l’élection du roitelet, à 30m sur la même carte pour les débutants de l’année.
    L’heureux archer couronné roi pour la troisième fois est nommé « Empereur ». Le roi de l’année est ceint de l’écharpe rouge remise par le roi « déchut ». Le roitelet reçoit l’écharpe verte. Les archers débutant ont parfois du mal à atteindre l’oiseau. Si le concours s’éternise, le roitelet est nommé à la meilleure flèche.
- question: Comment changer de compagnie ou de club ?
  reponse: |
    Si vous changez de compagnie ou de club, il faudra impérativement en informer votre ancienne compagnie qui doit procéder à votre radiation, sans quoi votre ré-inscription sera impossible auprès de la FFTA.
- question: Puis-je m'initier seul au tir à l'arc ?
  reponse: |
    **Oui mais très fortement déconseillé !**
    Un arc est une **arme** de catégorie D qui peut être extrêmement dangereuse si elle n'est pas manipulé avec précaution.
    Une flèche, même tirée depuis un arc d'initiation peut parcourir plus de 200m et donc blesser grièvement ou dans la pire situation amener au décès d'une personne.
    L'initiation en compagnie / club vous garantira de tirer dans un environnement **sécurisé** avec un **arc adapté** et d'acquérir la bonne **technique** et les réflexes de **sécurité**.
- question: Les inscriptions sont-elles possibles toute l'année ?
  reponse: |
    **OUI ! Mais...**
    Il est toujours possible de s'inscrire en cours d'année.
    Cependant, depuis les dernières olympiades de Paris 2024, il est fortement recommandé de s'inscrire dès le forum des associations de Pontoise, début septembre.
    De plus, pour les débutants il est souhaitable de s'inscrire en début d'année afin de nous permettre de gérer la formation et la progression. Cependant nous essayons toujours d'intégrer quelques débutants en cours d'année.
    Pour les archers confirmés, cela ne pose aucun problème.
- question: Calcul de l'âge fédéral et de la catégorie
  reponse: |
    #### Le règlement
    - Une saison sportive s’étend du début du mois d’octobre à la fin du mois de septembre de l’année qui suit. Elle couvre deux quantièmes : le deuxième correspond à l’année licence.
    - L’année licence a pour valeur le quantième annuel s’étendant de janvier à septembre d’une saison sportive.
        Par exemple : Octobre 2025 - Septembre 2026 ; l'année de licence est 2026
    - L’âge de l’individu correspond au résultat de l’opération : année licence moins année de naissance.
    - Les licenciés des deux sexes en activité sont classés en fonction de leur âge "fédéral" dans les catégories suivantes quelque soient le type d’arc utilisé, et la discipline sportive

    Exemple :
    - Un licencié est né le 13 décembre 1986. La date du jour est 5 octobre 2025.
    - La saison sportive est : 2025-2026.
    - L’année licence est 2026.
    - L’âge retenu est : 2026 – 1986 = 40 ans, même si l'intéressé est encore à plus de deux mois de son 39ème anniversaire !

    #### Les catégories
    - 10 ans et moins : Poussin
    - 11 à 12 ans : U13 (ex Benjamin)
    - 13 à 14 ans : U15 (ex Minime)
    - 15 à 17 ans : U18 (ex Cadet)
    - 18 à 20 ans : U21 (ex Junior)
    - 21 à 39 ans : Sénior 1
    - 40 à 59 ans : Sénior 2
    - 60 ans et plus : Sénior 3

    Ces catégories pourraient être dénommées « CATÉGORIES LICENCE » ou « CATÉGORIES D’ÂGES »
- question: Qui peut pratiquer le tir à l'arc ?
  reponse: |
    Tout le monde peut pratiquer ou découvrir le tir à l'arc ... de 8 à 88 ans ! (voire plus)
    Il suffit d'une attestation médicale de votre médecin.
    Cependant la pratique du tir à l'arc n'est pas possible avant 8 ans (interdiction fédérale).
    Nous pensons que 10 ans est l'age idéal pour commencer à pratiquer ce sport en raison de l'attention demandée (sécurité) et de la coordination.
- question: Dois-je faire de la compétition ?
  reponse: |
    Chacun a sa place au sein de la compagnie.
    Nous avons des équipes de compétiteurs au joli palmarès, et une séance hebdomadaire d'entraînement spécifique.
    Nous avons aussi des nombreux archers qui viennent uniquement pour se détendre.
    La seule chose que nous demandons à tous est de participer à la vie de la Compagnie, qui fonctionne uniquement grâce au bénévolat (et pas seulement celui des membres du bureau !)
- question: Dois-je acheter un arc ?
  reponse: |
    **Si vous débutez, ne vous précipitez pas!**
    La compagnie prête des arcs pendant les 6 premiers mois de votre apprentissage.
    Il faut prendre le temps de découvrir quel arc vous convient.
    Si en cours d'année vous vous décidez d'acheter un arc, demandez nous conseil avant d'effectuer votre achat. Nous serons ravi de pouvoir vous aider/accompagner.
