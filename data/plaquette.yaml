---
# Contenus propres à la plaquette. Les créneaux sont référencés par
# (jour, debut) vers data/planning.yaml et les tarifs par identifiant
# de catégorie vers data/tarifs.yaml : le build résout et vérifie
# toutes les références, et calcule les coûts (licence + formation).
#
# Dans les textes (blocs « >- »), une LIGNE VIDE sépare deux
# paragraphes. À l'intérieur d'un paragraphe, les lignes peuvent être
# coupées librement pour rester sous 120 colonnes : elles seront
# rassemblées au rendu.

accroche: La passion du tir à l'arc depuis 1903

qu_est_ce: >-
  Le tir à l'arc est un sport de compétition et de détente.
  Il développe la concentration, la précision et l'esprit d'équipe.

presentation: >-
  Plus d'une centaine de membres pratiquent le tir à l'arc dans
  différentes disciplines : tir en salle, tir olympique, tir de
  tradition (Beursault), tir en campagne, tir 3D…

  Tous niveaux — débutants, compétitions, loisirs.
lieux:
  - nom: Salle d'armes et terrain
    detail: >-
      1 rue Pierre de Coubertin, 95300 Pontoise

      Toute l'année
  - nom: Gymnase Marie Laurencin
    detail: >-
      D'octobre à fin mars, pour les jeunes du mercredi soir.
tir_libre_autonomie: >-
  Pas de restriction d'horaire ni de jour, après autorisation de la
  Capitaine-Présidente ou des entraîneurs, et pour les majeurs.

  Hors précisions du planning, le tir libre se fait en demi pas de tir
  pendant les créneaux encadrés, au rythme de l'encadrant.
securite_jeunes: >-
  Par mesure de sécurité, les jeunes doivent tous être inscrits dans
  un groupe encadré.

label:
  intitule: Label Club FFTA « Ambition »
  validite: Valable jusqu'à fin 2026

contacts:
  - role: Capitaine-Présidente
    nom: Sandrine Keerstock
    courriel: arcpontoise@yahoo.fr
  - role: Secrétariat — informations et formations
    courriel: archerspontoise@gmail.com

reseaux:
  - nom: Site internet
    picto: site
    libelle: arcpontoise.fr
    lien: https://arcpontoise.fr
  - nom: Facebook
    picto: facebook
    libelle: Compagnie d'archers de Pontoise
    lien: https://www.facebook.com/archerspontoise/
  - nom: Instagram
    picto: instagram
    libelle: Compagnie d'archers de Pontoise
    lien: https://www.instagram.com/compagnie_archers_pontoise/

qr_codes:
  - libelle: Le site de la compagnie
    lien: https://arcpontoise.fr
  - libelle: Informations
    lien: https://infos.arcpontoise.fr

groupes:
  - id: petits-robins-debutants
    titre: Petits Robins débutants
    public: U11 et U13, 8 ans révolus au 01/09/2026
    places: 8
    description: >-
      Apprentissage sous forme ludique des gestes fondamentaux du tir à
      l'arc, encadré par deux encadrants dont un certifié.

      L'arc est mis à disposition sous conditions.
    formation: 60.00
    licences:
      - categorie: jeune
        libelle: U13
      - categorie: poussin
        libelle: U11
    creneaux:
      - jour: vendredi
        debut: "17:30"

  - id: jeunes-debutants
    titre: Jeunes débutants et para-archers
    public: >-
      À partir de U15, nés en 2014 ou avant
    places: 12
    description: >-
      Formation première année encadrée par un entraîneur et deux
      encadrants dont un certifié.

      L'arc est mis à disposition sous conditions.
    formation: 156.00
    licences:
      - categorie: jeune
        libelle: U15 à U21
    creneaux:
      - jour: jeudi
        debut: "19:30"

  - id: jeunes-confirmes
    titre: Jeunes confirmés et compétiteurs
    public: 2ᵉ année et plus, U13 à U21
    description: >-
      Encadré par deux entraîneurs et un encadrant. Gymnase en hiver,
      terrain d'avril à fin juin.

      Possibilité de location d'arc avec caution, selon le niveau
      acquis.
    licences:
      - categorie: jeune
        libelle: licence FFTA
    creneaux:
      - jour: mercredi
        debut: "19:00"
      - jour: samedi
        debut: "14:00"

  - id: tir-de-parcours
    titre: Tir de parcours
    public: Nature, campagne et 3D
    description: >-
      Sortir du pas de tir : distances inconnues, terrain naturel,
      cibles animalières ou blasons en extérieur.

      Ouvert à tous les archers autonomes, quel que soit le type d'arc.
    creneaux:
      - jour: samedi
        debut: "17:00"

  - id: arc-sans-viseur
    titre: Arc sans viseur
    public: Barebow, arc droit, poulie nu, ...
    description: >-
      Un créneau dédié aux arcs sans viseur.
    creneaux:
      - jour: mercredi
        debut: "19:00"

  - id: adultes-debutants
    titre: Adultes débutants et U21
    public: >-
      Adultes nés en 2006 ou avant

      U21 nés de 2007 à 2009
    places: 10
    description: >-
      Formation première année encadrée par un entraîneur et un
      encadrant. Les arcs sont prêtés les deux premiers trimestres
      (jusqu'à fin mars), location possible ensuite. Formation et
      matériel personnel compris dans le coût.
    formation: 162.00
    licences:
      - categorie: adulte-competition
        libelle: adulte
      - categorie: jeune
        libelle: U21
    creneaux:
      - jour: vendredi
        debut: "19:00"

  - id: adultes-confirmes
    titre: Adultes confirmés
    # public: Nés en 2006 ou avant
    description: >-
      Tous les créneaux de tir libre sont accessibles, en dehors des
      créneaux encadrés. Les horaires précis figurent sur le planning
      de la saison.
    licences:
      - categorie: adulte-competition
        libelle: pratique en compétition
      - categorie: adulte-club
        libelle: pratique en club

  - id: perfectionnement-adultes
    titre: Perfectionnement adultes
    description: >-
      Les archers désirant se perfectionner s'entraînent avec les
      conseils d'entraîneurs diplômés FFTA. Le mardi est orienté vers
      la pratique de la compétition.
    creneaux:
      - jour: lundi
        debut: "19:30"
      - jour: mardi
        debut: "18:30"
