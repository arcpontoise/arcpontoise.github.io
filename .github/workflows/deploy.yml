---
name: Build et déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Dépendances système (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpango-1.0-0 libpangoft2-1.0-0
      - name: Dépendances
        run: pip install -r requirements.txt
      - name: Lint YAML
        run: yamllint .
      - name: Lint Python
        run: |
          ruff check scripts
          ruff format --check scripts
      - name: Génération
        run: python scripts/build.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
